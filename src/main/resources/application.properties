spring.application.name=api
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mi_app_db}
spring.datasource.username=${DB_USER:mi_app_user}
spring.datasource.password=${DB_PASSWORD:mi_app_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

server.port=${PORT:8080}

resend.api.key=${RESEND_API_KEY:algo}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.security.oauth2.resourceserver.jwt.issuer-uri=${CAS_URL:http://cas:8080/realms/mathtexpedia}

gemini.api.keys=${GEMINI_API_KEYS:}
gemini.model=${GEMINI_MODEL:gpt-2.5-flash-lite}
mathtexpedia.sitemap.url=${MATHTEXPEDIA_SITEMAP_URL:https://mathtexpedia.es/sitemap.xml}
chatbot.daily-token-limit=${CHATBOT_DAILY_TOKEN_LIMIT:3000}
chatbot.anonymous-daily-request-limit=${CHATBOT_ANONYMOUS_DAILY_REQUEST_LIMIT:1}


aws.s3.bucket=${BUCKET_NAME:pdfs}
aws.s3.region=${S3_REGION:eu-west-1}
aws.s3.endpoint=${S3_ENDPOINT:}
aws.s3.presign.duration=${PRESIGNED_DURATION:15}

# Por defecto Spring Boot limita la subida a 1MB por fichero / 10MB por petición, insuficiente
# para PDFs reales (apuntes con imágenes, etc.). Se sube a 20MB; configurable por entorno.
spring.servlet.multipart.max-file-size=${MAX_UPLOAD_FILE_SIZE:20MB}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_REQUEST_SIZE:20MB}

# Notificaciones: las leídas se borran a los N días, todas a los M días; el job corre a diario (cron de Spring)
notifications.retention.read-days=${NOTIFICATIONS_READ_RETENTION_DAYS:90}
notifications.retention.max-days=${NOTIFICATIONS_MAX_RETENTION_DAYS:180}
notifications.cleanup.cron=${NOTIFICATIONS_CLEANUP_CRON:0 30 3 * * *}

# Comentarios de PDFs: longitud máxima, tope de comentarios pendientes de revisión por usuario, denunciantes distintos
# que ocultan un comentario, y retención de los rechazados (el job corre a diario)
comments.max-length=${COMMENTS_MAX_LENGTH:1000}
comments.max-pending-per-user=${COMMENTS_MAX_PENDING_PER_USER:3}
comments.report-hide-threshold=${COMMENTS_REPORT_HIDE_THRESHOLD:3}
comments.rejected-retention-days=${COMMENTS_REJECTED_RETENTION_DAYS:90}
comments.cleanup.cron=${COMMENTS_CLEANUP_CRON:0 45 3 * * *}

# Moderación: intentos fallidos de evaluar un comentario antes de mandarlo a revisión de un admin
moderation.max-attempts=${MODERATION_MAX_ATTEMPTS:3}

# Ollama vía Spring AI. El modelo se pasa en cada llamada desde moderation.ollama.model; vacío = moderación no disponible
spring.ai.ollama.base-url=${OLLAMA_URL:http://localhost:11434}
moderation.ollama.model=${OLLAMA_MODEL:}
# Sin reintentos de Spring AI (por defecto 10 con backoff de 2 s a minutos): el worker y el breaker deciden cuándo reintentar
spring.ai.retry.max-attempts=1
# Timeouts del cliente HTTP autoconfigurado; hoy solo lo usa Spring AI (GeminiAdapter y SitemapAdapter usan RestClient.create())
spring.http.clients.connect-timeout=3s
spring.http.clients.read-timeout=${MODERATION_OLLAMA_TIMEOUT_SECONDS:60}s

# Worker de moderación y circuit breaker de Ollama
moderation.worker.poll-interval-ms=${MODERATION_WORKER_POLL_INTERVAL_MS:10000}
moderation.breaker.initial-delay-seconds=${MODERATION_BREAKER_INITIAL_DELAY_SECONDS:60}
moderation.breaker.max-delay-seconds=${MODERATION_BREAKER_MAX_DELAY_SECONDS:300}
